# Optional local development recipe. Render built the Docker image; Compose is unverified.
# No database/queue services are implied: this first slice uses private SQLite.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      KEEPSAKE_DATA_DIR: /tmp/keepsake-data
      KEEPSAKE_STORAGE_MODE: ephemeral
      KEEPSAKE_RETENTION_HOURS: ${KEEPSAKE_RETENTION_HOURS:-24}
      KEEPSAKE_ALLOWED_ORIGIN: http://localhost:3000
      KEEPSAKE_OPERATOR_TOKEN: ${KEEPSAKE_OPERATOR_TOKEN:-}
      # The image bundles Linux Blender; override only with a compatible binary.
      BLENDER_BIN: ${CONTAINER_BLENDER_BIN:-/opt/blender/blender}
    restart: "no"
  web:
    image: node:24-bookworm-slim
    working_dir: /app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_ORIGIN: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - web-dependencies:/app/node_modules
      - web-build:/app/apps/web/.next
    command: >-
      sh -c "npm ci && npm exec --workspace @keepsake/web -- next dev --hostname 0.0.0.0"
    depends_on:
      - api
    restart: "no"
volumes:
  web-dependencies:
  web-build:
